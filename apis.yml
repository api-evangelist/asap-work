name: Asap Work
description: >-
  Asap.work is a next-generation temporary staffing, permanent placement, and
  freelance recruitment platform for the French construction and skilled-trades
  sector (BTP - Batiment et Travaux Publics). It connects tradespeople with
  short-term missions, permanent roles, and freelance projects through a mobile
  app and a network of consultants, and layers on worker benefits such as
  housing assistance, medical consultations, training via asap.academy, and
  wage advances. The company is backed by speedinvest and is expanding toward
  the United States. Asap.work publishes no public developer API, developer
  portal, or API documentation; this profile was added to the API Evangelist
  network as a portfolio-lead stub and, on enrichment, was confirmed to have no
  machine-readable API surface (searched 2026-07-18).
